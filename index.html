<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Nightreign Skill Finder</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control strip over a two-pane board, ranked locations on the left, the chosen location's weapon breakdown on the right; stacks to one column on phones. */
:root {
  --bg: #eef0f4;
  --panel: #ffffff;
  --ink: #1b2030;
  --muted: #5b6275;
  --line: #d6dae3;
  --accent: #9a6a1c;
  --accent-soft: #f3e7cf;
  --bar: #c99a45;
  --bar-track: #e6e9ef;
  --focus: #3b5bdb;
  --a-std: #6f7686; --a-fire: #d0541f; --a-lightning: #c99a00; --a-holy: #b08a3e;
  --a-magic: #3f63d6; --a-frost: #2a93b4; --a-poison: #4e8a2e; --a-blood: #b3243a;
  --a-madness: #d88a12; --a-rot: #9b4a2a; --a-sleep: #7a5bc4;
  --r0: #7b8090; --r1: #3a77c9; --r2: #8a4fc4; --r3: #c49a2a;
  --display: "Marcellus SC", "Noto Serif TC", Georgia, serif;
  --body: "Noto Sans TC", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --panel: #171b2c; --ink: #e6e3d8; --muted: #9aa0b4; --line: #2a3047;
    --accent: #e0b867; --accent-soft: #33291a; --bar: #d4a64f; --bar-track: #242a40; --focus: #8fa8ff;
    --a-std: #9aa1b3; --a-fire: #f07a45; --a-lightning: #f0cc3a; --a-holy: #e3c47e;
    --a-magic: #7f9cff; --a-frost: #5cc6e4; --a-poison: #84c35c; --a-blood: #ef5a70;
    --a-madness: #f5a623; --a-rot: #d07a54; --a-sleep: #ad8ff0;
    --r0: #a2a7b6; --r1: #6aa6f2; --r2: #b989f0; --r3: #e6c25a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --panel: #171b2c; --ink: #e6e3d8; --muted: #9aa0b4; --line: #2a3047;
  --accent: #e0b867; --accent-soft: #33291a; --bar: #d4a64f; --bar-track: #242a40; --focus: #8fa8ff;
  --a-std: #9aa1b3; --a-fire: #f07a45; --a-lightning: #f0cc3a; --a-holy: #e3c47e;
  --a-magic: #7f9cff; --a-frost: #5cc6e4; --a-poison: #84c35c; --a-blood: #ef5a70;
  --a-madness: #f5a623; --a-rot: #d07a54; --a-sleep: #ad8ff0;
  --r0: #a2a7b6; --r1: #6aa6f2; --r2: #b989f0; --r3: #e6c25a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
html[lang="ja"] body { font-family: "Noto Sans JP", "Noto Sans TC", system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 3.6vw, 2.3rem); letter-spacing: .04em; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 small { display: block; font-family: var(--body); font-size: .9rem; letter-spacing: .02em; color: var(--muted); margin-top: 6px; font-weight: 500; }
h2 { font-size: 1rem; margin: 0; font-weight: 700; letter-spacing: .02em; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .85rem; padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.controls { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: .78rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
input[type="search"], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .88rem; }
.checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); font-size: .88rem; letter-spacing: 0; }
.skilllist { max-height: 228px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 6px; display: grid; gap: 8px; }
.sgroup { display: grid; gap: 4px; }
.sgroup .eyebrow { padding: 2px 4px; display: flex; align-items: center; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: .84rem; padding: 3px 9px; border-radius: 6px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--a-std); }

.summary { border-left: 4px solid var(--accent); background: var(--panel); border-radius: 0 10px 10px 0; padding: 14px 16px; display: grid; gap: 6px; }
.summary .skillname { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.summary p { margin: 0; max-width: 75ch; }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: 1.05rem; }
.aff { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.big { font-family: var(--mono); font-weight: 500; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.pane-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
ol.locs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.loc { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 4.2em; gap: 4px 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.loc:hover { background: var(--bg); }
.loc[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.loc .rank { font-family: var(--mono); color: var(--muted); font-size: .8rem; text-align: right; }
.loc .name { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.loc .name span.t { overflow-wrap: anywhere; }
.tag { font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.loc .pct { font-family: var(--mono); text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.loc .barline { grid-column: 2 / 4; height: 5px; background: var(--bar-track); border-radius: 3px; overflow: hidden; }
.loc .barline i { display: block; height: 100%; background: var(--bar); border-radius: 3px; }
.loc .sub { grid-column: 2 / 4; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .74rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.best td { background: var(--accent-soft); }
.minibar { display: inline-block; vertical-align: middle; width: 56px; height: 5px; background: var(--bar-track); border-radius: 3px; overflow: hidden; margin-left: 6px; }
.minibar i { display: block; height: 100%; background: var(--bar); }
.rar { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.empty { color: var(--muted); padding: 18px 4px; }
.view { display: grid; gap: 18px; }
.tabs { display: flex; gap: 4px; border-bottom: 1px solid var(--line); }
.tabs button { font: inherit; font-weight: 700; color: var(--muted); background: transparent; border: 0; border-bottom: 3px solid transparent; padding: 8px 14px; cursor: pointer; margin-bottom: -1px; }
.tabs button[aria-selected="true"] { color: var(--ink); border-bottom-color: var(--accent); }
.controls.one { grid-template-columns: minmax(0, 1fr); }
tr.sect th { background: var(--bg); color: var(--ink); font-size: .78rem; text-align: left; padding-top: 10px; }
td.hi { background: var(--accent-soft); font-weight: 700; }
.flag { font-size: .7rem; font-weight: 700; border-radius: 4px; padding: 1px 6px; border: 1px solid var(--accent); color: var(--accent); white-space: nowrap; }
.flag.bad { border-color: var(--a-blood); color: var(--a-blood); }
details.notes { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.notes summary { cursor: pointer; font-weight: 700; }
details.notes ul { margin: 10px 0 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 80ch; font-size: .9rem; color: var(--muted); }
.busy { opacity: .55; transition: opacity .15s; }
@media (max-width: 860px) {
  .controls, .board { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) { .filters { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<div class="wrap">
  <header>
    <h1 id="title">Nightreign Skill Finder<small id="subtitle"></small></h1>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <nav class="tabs" role="tablist" aria-label="View">
    <button type="button" role="tab" id="tab-skill" data-view="skill" aria-selected="true"></button>
    <button type="button" role="tab" id="tab-effect" data-view="effect" aria-selected="false"></button>
  </nav>

  <div id="view-skill" class="view">
  <section class="controls" aria-label="Filters">
    <div class="field">
      <label for="q" id="l-skill"></label>
      <input type="search" id="q" autocomplete="off">
      <div class="skilllist" id="skilllist" role="listbox" aria-labelledby="l-skill"></div>
    </div>
    <div class="filters">
      <div class="field">
        <label for="cls" id="l-cls"></label>
        <select id="cls"></select>
      </div>
      <div class="field">
        <label for="map" id="l-map"></label>
        <select id="map"></select>
      </div>
      <div class="field" style="grid-column: 1 / -1">
        <span class="lbl" id="l-var"></span>
        <div class="checks">
          <label><input type="checkbox" id="v-base" checked> <span id="t-v-base"></span></label>
          <label><input type="checkbox" id="v-v"> <span id="t-v-v"></span></label>
          <label><input type="checkbox" id="v-x"> <span id="t-v-x"></span></label>
        </div>
      </div>
      <div class="field" style="grid-column: 1 / -1">
        <span class="lbl" id="l-kind"></span>
        <div class="checks">
          <label><input type="checkbox" id="k-site" checked> <span id="t-k-site"></span></label>
          <label><input type="checkbox" id="k-other" checked> <span id="t-k-other"></span></label>
        </div>
      </div>
    </div>
  </section>

  <section class="summary" id="summary" aria-live="polite"></section>

  <section class="board">
    <div class="pane">
      <div class="pane-head"><h2 id="h-locs"></h2><span class="eyebrow" id="e-locs"></span></div>
      <p class="hint" id="hint-locs"></p>
      <ol class="locs" id="locs"></ol>
    </div>
    <div class="pane" id="detail">
      <div class="pane-head"><h2 id="h-detail"></h2><span class="eyebrow" id="e-detail"></span></div>
      <p class="hint" id="hint-types"></p>
      <div class="tablewrap"><table id="types"></table></div>
      <h2 id="h-weps" style="margin-top:8px"></h2>
      <p class="hint" id="hint-weps"></p>
      <div class="tablewrap"><table id="weps"></table></div>
    </div>
  </section>

  <details class="notes">
    <summary id="n-title"></summary>
    <ul id="n-list"></ul>
  </details>
  </div>

  <div id="view-effect" class="view" hidden>
    <section class="controls one" aria-label="Effects">
      <div class="field">
        <label for="eq" id="l-eff"></label>
        <input type="search" id="eq" autocomplete="off">
        <div class="skilllist" id="efflist" role="listbox" aria-labelledby="l-eff"></div>
      </div>
    </section>
    <section class="summary" id="esum" aria-live="polite"></section>
    <section class="board">
      <div class="pane">
        <div class="pane-head"><h2 id="h-any"></h2><span class="eyebrow" id="e-any"></span></div>
        <p class="hint" id="hint-any"></p>
        <div class="tablewrap"><table id="anyt"></table></div>
        <div class="pane-head" style="margin-top:8px"><h2 id="h-pool"></h2><span class="eyebrow" id="e-pool"></span></div>
        <p class="hint" id="hint-pool"></p>
        <div class="tablewrap"><table id="pools"></table></div>
      </div>
      <div class="pane">
        <div class="pane-head"><h2 id="h-fixed"></h2><span class="eyebrow" id="e-fixed"></span></div>
        <p class="hint" id="hint-fixed"></p>
        <div class="tablewrap"><table id="fixed"></table></div>
      </div>
    </section>
    <details class="notes">
      <summary id="en-title"></summary>
      <ul id="en-list"></ul>
    </details>
  </div>
</div>

const DISC_TYPES = [1, 3, 5, 7, 9, 11, 13, 14, 15, 16, 17, 19, 21, 23, 24, 25, 28, 29, 31, 35, 37, 39, 41, 51, 53, 55, 56, 57, 61, 65, 67, 69, 87];
// each hero's default favoured types (the class rows of the For Class tables)
const HERO_TYPE = { 1: [5], 2: [29], 3: [51], 4: [1], 5: [23, 19, 41], 6: [61], 7: [57], 8: [13], 9: [15], 10: [21] };
const AFF_ORDER = ['lightning', 'fire', 'holy', 'magic', 'frost', 'poison', 'blood'];
const STD_GROUPS = [10, 20, 30, 120, 130, 140];
const SITE_KINDS = new Set(['camp', 'ruins', 'church', 'fort', 'marsh', 'village', 'ufort']);

let lang = 'zh';
try { const s = localStorage.getItem('nr-lang'); if (s && T[s]) lang = s; } catch (e) {}
// merge skills that share a name; a skill is "common" if it appears in any multi-entry skill table
const pooled = new Set();
for (const t of Object.values(D.sats)) if (t.length > 1) for (const x of t) pooled.add(x[0]);
const SK = new Map();
for (const [id, s] of Object.entries(D.skills)) {
  if (!s.n.en || s.n.en === '%null%') continue;
  const key = s.n.en;
  if (!SK.has(key)) SK.set(key, { key, n: s.n, ids: new Set(), a: s.a, g: s.g, u: true });
  const e = SK.get(key);
  e.ids.add(+id);

const st = { skills: new Set(['Thunderbolt']), cls: 'avg', map: 'all', vars: new Set(['']), site: true, other: true, sel: null };

const nm = o => (o && (o[lang] || o.en)) || '';

const affColor = a => `var(--a-${a || 'std'})`;

// ---------- probability engine ----------
const tmemo = new Map();
// mode: 'avg' | 'c<hero>' (hero's default favoured type) | 't<wepType>' (favoured type chosen in Deep of Night)
function parseMode(m) {
  if (m[0] === 'c') { const c = +m.slice(1); return [c, 1000 + 100 * c]; }
  return [0, +m.slice(1)];
}
function tdist(t, mode, depth) {
  const key = t + '|' + mode;
  if (tmemo.has(key)) return tmemo.get(key);
  const out = new Map();
  tmemo.set(key, out);
  const [cls, disc] = parseMode(mode);
  const isClass = (D.tables[t] || []).some(r => r[4] !== -1);
  const tag = k => (isClass && k[0] !== 'K' ? 'K' + k : k);
  const rows = (D.tables[t] || []).filter(r => (r[3] === 0 || r[3] === cls) && (r[4] === -1 || r[4] === disc));
  let tot = 0;
  for (const r of rows) tot += r[2];
  if (tot > 0 && (depth || 0) < 24) {
    for (const r of rows) {
      const p = r[2] / tot;
      if (r[0] === 7) for (const [k0, v] of tdist(r[1], mode, (depth || 0) + 1)) { const k = tag(k0); out.set(k, (out.get(k) || 0) + p * v); }
      else if (r[0] === 6 || r[0] === 2) { const k = tag((r[0] === 6 ? 'c' : 'w') + r[1]); out.set(k, (out.get(k) || 0) + p); }
    }
  }

}
const lmemo = new Map();
function lotLeaves(lot, cls) {
  const key = lot + '|' + cls;
  if (lmemo.has(key)) return lmemo.get(key);
  let out = new Map();
  if (cls === 'avg') {
    for (let c = 1; c <= 10; c++) for (const [k, v] of lotLeaves(lot, 'c' + c)) out.set(k, (out.get(k) || 0) + v / 10);
  } else {
    const slots = D.lots[lot] || [];
    let tot = 0;
    for (const s of slots) tot += s[2];
    for (const s of slots) {
      const p = s[2] / tot;
      if (s[0] === 7) for (const [k, v] of tdist(s[1], cls, 0)) out.set(k, (out.get(k) || 0) + p * v);
      else if (s[0] === 6 || s[0] === 2) { const k = (s[0] === 6 ? 'c' : 'w') + s[1]; out.set(k, (out.get(k) || 0) + p); }
    }
  }

  return out;
}
const smemo = new Map();
function leafInfo(k) {
  if (smemo.has(k)) return smemo.get(k);

    if (cw) {
      wep = cw[0];
      const sat = cw[1] > 0 && D.sats[cw[1]];
      if (sat && sat.length) {
        let tot = 0; for (const x of sat) tot += x[1];
        skills = sat.map(x => [x[0], x[1] / tot]);
      }
    }
  } else wep = +k.slice(1);
  const w = wep != null && D.weps[wep];
  if (w && !skills.length) skills = [[w[1], 1]];
  const info = w ? { wep, type: w[0], skills } : null;

}
function analyse(skill) {

  for (const key of skill) for (const id of SK.get(key).ids) ids.add(id);
  const res = [];
  for (const g of D.groups) {
    if (!st.vars.has(g.var)) continue;
    if (st.map !== 'all' && g.map !== st.map) continue;
    const site = SITE_KINDS.has(g.kind) && g.aff;
    if (site ? !st.site : !st.other) continue;
    let miss = 1, rows = [];

    const typeSkill = new Map(), gSkill = new Map(), gAll = new Map(), kSkill = new Map(), kAll = new Map(), wepSkill = new Map(), wepAll = new Map();
    const add = (m, key, v) => m.set(key, (m.get(key) || 0) + v);
    for (const lot of g.lots) {
      let p = 0;
      for (const [k, v] of lotLeaves(lot, st.cls)) {
        const isK = k[0] === 'K';
        const info = leafInfo(isK ? k.slice(1) : k);
        if (!info) continue;
        add(isK ? kAll : gAll, info.type, v);
        if (!isK) add(wepAll, info.wep, v);

          p += q;

          add(isK ? kSkill : gSkill, info.type, q);
          if (!isK) add(wepSkill, info.wep, q);

  res.sort((a, b) => b.any - a.any);
  return res;
}

const $ = id => document.getElementById(id);

function renderSkills() {
  const t = T[lang];
  const q = $('q').value.trim().toLowerCase();
  const groups = new Map();
  for (const s of SK.values()) {
    const n = nm(s.n);
    if (q && ![s.n.zh, s.n.ja, s.n.en].some(x => x && x.toLowerCase().includes(q))) continue;
    const key = s.u ? 'unique' : s.a !== 'std' ? s.a : STD_GROUPS.includes(s.g) ? 'std' + s.g : 'stdx';
    if (!groups.has(key)) groups.set(key, []);
    groups.get(key).push([s.key, n]);
  }
  const order = [...AFF_ORDER, ...STD_GROUPS.map(g => 'std' + g), 'stdx', 'unique'];
  let html = '';
  for (const key of order) {
    const list = groups.get(key);
    if (!list) continue;
    list.sort((a, b) => a[1].localeCompare(b[1], lang === 'en' ? 'en' : lang === 'ja' ? 'ja' : 'zh-Hant'));
    const label = key === 'unique' ? t.unique : key.startsWith('std') ? `${t.affName.std}・${t.stdGroup[key.slice(3)]}` : t.affName[key];
    const col = key === 'unique' ? 'var(--accent)' : affColor(key.startsWith('std') ? 'std' : key);
    html += `<div class="sgroup"><div class="eyebrow"><span class="dot" style="background:${col}"></span>${label}</div><div class="chips">` +
      list.map(([id, n]) => `<button type="button" class="chip" data-skill="${esc(id)}" aria-pressed="${st.skills.has(id)}">${esc(n)}</button>`).join('') + '</div></div>';
  }

function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function locLabel(g) { return nm(g.label); }

function bestType(r) {
  let best = null;
  for (const [ty, ps] of r.gSkill) {
    const all = r.gAll.get(ty) || 0;
    if (!all) continue;
    const cond = ps / all;
    if (ps / r.rows.reduce((a, b) => a + b, 0) < 0.03) continue;
    if (!best || cond > best.cond) best = { ty, cond };
  }
  return best;
}

let lastRes = [];
function renderResults() {
  const t = T[lang];
  const clear = () => { $('locs').innerHTML = ''; $('types').innerHTML = ''; $('weps').innerHTML = ''; $('h-detail').textContent = t.detail; $('e-detail').textContent = ''; };
  if (!st.skills.size) { lastRes = []; $('summary').innerHTML = `<p>${t.pick}</p>`; clear(); return; }

  lastRes = res;
  const keys = [...st.skills];
  const sName = keys.map(skillLabel).join(t.sep);
  const affHtml = keys.map(k => {
    const s = SK.get(k), a = s && !s.u ? s.a : null;
    const badge = a ? `<span class="aff" style="color:${affColor(a)}">${t.affName[a]}</span>` : `<span class="aff" style="color:var(--accent)">${t.unique}</span>`;
    return keys.length > 1 ? `<span class="pick">${esc(skillLabel(k))} ${badge}</span>` : `${esc(skillLabel(k))} ${badge}`;
  }).join('');

function renderDetail() {
  const t = T[lang];
  const r = lastRes.find(x => x.g === st.sel);
  if (!r) return;
  $('h-detail').textContent = `${t.detail}：${locLabel(r.g)}`;
  $('e-detail').textContent = varTag(r.g.var);
  const totalSkill = [...r.typeSkill.values()].reduce((a, b) => a + b, 0);
  const cond = (m, a, ty) => (a.get(ty) ? (m.get(ty) || 0) / a.get(ty) : null);
  const types = [...r.typeSkill.entries()].map(([ty, ps]) => ({ ty, ps, g: cond(r.gSkill, r.gAll, ty), k: cond(r.kSkill, r.kAll, ty), share: ps / totalSkill }))
    .sort((a, b) => (b.g ?? -1) - (a.g ?? -1) || (b.k ?? -1) - (a.k ?? -1));
  const cell = v => v == null ? '<td class="num">—</td>' : `<td class="num">${pct(v, 1)}<span class="minibar"><i style="width:${Math.min(100, v * 100).toFixed(1)}%"></i></span></td>`;
  const bt = bestType(r);
  $('types').innerHTML = `<thead><tr><th>${t.type}</th><th class="num">${t.slotG}</th><th class="num">${t.slotK}</th><th class="num">${t.share}</th></tr></thead><tbody>` +
    types.map(x => `<tr class="${bt && bt.ty === x.ty ? 'best' : ''}"><td>${esc(nm(D.types[x.ty]))}</td>${cell(x.g)}${cell(x.k)}<td class="num">${pct(x.share, 1)}</td></tr>`).join('') + '</tbody>';
  // individual weapons whose conditional odds differ from their type average
  const rows = [...r.wepSkill.entries()].map(([w, ps]) => {
    const all = r.wepAll.get(w) || 1, ty = D.weps[w][0];
    const typeCond = (r.gSkill.get(ty) || 0) / (r.gAll.get(ty) || 1);
    return { w, ps, cond: ps / all, ty, typeCond, rar: D.weps[w][2] };
  }).filter(x => x.ps / totalSkill > 0.002);
  rows.sort((a, b) => Math.abs(b.cond - b.typeCond) - Math.abs(a.cond - a.typeCond) || b.cond - a.cond);
  const shown = rows.slice(0, 12).sort((a, b) => b.cond - a.cond);
  $('weps').innerHTML = shown.length ? `<thead><tr><th>${t.wep}</th><th>${t.type}</th><th class="num">${t.cond}</th><th class="num">${t.typeAvg}</th></tr></thead><tbody>` +
    shown.map(x => `<tr><td><span class="rar" style="background:var(--r${Math.min(3, x.rar)})" title="${t.rar[Math.min(3, x.rar)]}"></span>${esc(nm(D.wnames[x.w]))}</td><td>${esc(nm(D.types[x.ty]))}</td><td class="num">${pct(x.cond, 1)}</td><td class="num">${pct(x.typeCond, 1)}</td></tr>`).join('') + '</tbody>' : '';
}

function refresh() {
  document.querySelector('.board').classList.add('busy');
  setTimeout(() => { renderResults(); document.querySelector('.board').classList.remove('busy'); }, 16);
}

document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {

$('cls').addEventListener('change', e => { st.cls = e.target.value; refresh(); });
$('map').addEventListener('change', e => { st.map = e.target.value; refresh(); });
[['v-base', ''], ['v-v', 'v'], ['v-x', 'x']].forEach(([id, v]) => $(id).addEventListener('change', e => { e.target.checked ? st.vars.add(v) : st.vars.delete(v); refresh(); }));
$('k-site').addEventListener('change', e => { st.site = e.target.checked; refresh(); });
$('k-other').addEventListener('change', e => { st.other = e.target.checked; refresh(); });
function pick(li) { const r = lastRes[+li.dataset.i]; if (!r) return; st.sel = r.g; document.querySelectorAll('.loc').forEach(x => x.setAttribute('aria-selected', String(x === li))); renderDetail(); }
$('locs').addEventListener('click', e => { const li = e.target.closest('.loc'); if (li) pick(li); });
$('locs').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const li = e.target.closest('.loc'); if (li) { e.preventDefault(); pick(li); } } });

// ---------- passive effects ----------
const E = D.E;
const POOL_GROUP = types => types.includes(65) ? 'shield' : types.includes(57) ? 'staff' : types.includes(61) ? 'seal' : types.includes(51) ? 'ranged' : 'melee';
function effGroup(e) {
  const ks = Object.keys(e.pools);
  if (ks.some(k => k.startsWith('reg'))) return 'reg';
  if (ks.some(k => k.startsWith('dn'))) return 'dn';
  if (ks.some(k => k.startsWith('bless'))) return 'bless';
  if (ks.includes('curse')) return 'curse';
  return 'fixed';
}
const est = { sel: new Set(['Improved Attack Power at Full HP']), view: 'skill' };
// weapon groups with the type code used to find their pools, and their blessing table
const WGROUPS = [['melee', 1, 'Melee'], ['shield', 65, 'Shield'], ['staff', 57, 'Magic'], ['seal', 61, 'Magic'], ['bow', 51, 'Bow'], ['heavy', 53, 'Heavy Ranged']];
const poolOf = (pre, code) => Object.keys(E.pools).find(k => k.startsWith(pre) && E.pools[k].includes(code));
// slots of each weapon colour: [pool kind, tier index]
const COLS = [[['reg', 0]], [['reg', 1]], [['reg', 2]], [['curse', 0], ['reg', 1], ['dn', 1]], [['curse', 1], ['reg', 2], ['dn', 2]], [['curse', 2], ['reg', 2], ['bless', 0]]];
function slotP(keys, pool, tier) {
  if (!pool) return 0;
  let p = 0;
  for (const k of keys) { const v = E.effects[k].pools[pool]; if (v) p += v[tier] || 0; }
  return Math.min(1, p);
}
function anyTable(keys) {
  return WGROUPS.map(([g, code, bl]) => {
    const pools = { reg: poolOf('reg', code), dn: poolOf('dn', code), bless: 'bless:' + bl, curse: 'curse' };
    return { g, vals: COLS.map(slots => 1 - slots.reduce((m, [kind, tier]) => m * (1 - slotP(keys, pools[kind], tier)), 1)) };
  });
}
try { const v = localStorage.getItem('nr-view'); if (v === 'effect' || v === 'skill') est.view = v; } catch (e) {}

function renderEffList() {
  const t = T[lang];
  const q = $('eq').value.trim().toLowerCase();
  const groups = { reg: [], dn: [], bless: [], curse: [], fixed: [] };
  for (const [k, e] of Object.entries(E.effects)) {
    if (q && ![e.n.zh, e.n.ja, e.n.en].some(x => x && x.toLowerCase().includes(q))) continue;
    groups[effGroup(e)].push([k, nm(e.n)]);
  }
  let html = '';
  for (const g of ['reg', 'dn', 'bless', 'curse', 'fixed']) {
    const list = groups[g];
    if (!list.length) continue;
    list.sort((a, b) => a[1].localeCompare(b[1], lang === 'en' ? 'en' : lang === 'ja' ? 'ja' : 'zh-Hant'));
    html += `<div class="sgroup"><div class="eyebrow"><span class="dot" style="background:${g === 'curse' ? 'var(--a-blood)' : g === 'reg' ? 'var(--a-std)' : 'var(--accent)'}"></span>${t.eg[g]}</div><div class="chips">` +
      list.map(([k, n]) => `<button type="button" class="chip" data-eff="${esc(k)}" aria-pressed="${est.sel.has(k)}">${esc(n)}</button>`).join('') + '</div></div>';
  }
  $('efflist').innerHTML = html || '<div class="empty">—</div>';
}

function renderEffect() {
  const t = T[lang];
  const keys = [...est.sel].filter(k => E.effects[k]);
  if (!keys.length) {
    $('esum').innerHTML = `<p>${t.epick}</p>`;
    ['anyt', 'pools', 'fixed'].forEach(id => { $(id).innerHTML = ''; });
    $('e-fixed').textContent = '';
    return;
  }
  const names = keys.map(k => nm(E.effects[k].n));
  const table = anyTable(keys);

  // summary
  const badge = k => {
    const e = E.effects[k], grp = effGroup(e);
    return ((grp === 'dn' || grp === 'bless') && !e.fixed.some(r => r[2] === 'n') ? ` <span class="flag">${t.dnOnly}</span>` : '') + (grp === 'curse' ? ` <span class="flag bad">${t.curseTag}</span>` : '');
  };
  let line;
  if (keys.length === 1) {
    const e = E.effects[keys[0]], name = names[0], grp = effGroup(e);
    if (grp === 'reg') {
      let best = null, melee = 0;
      for (const [k, v] of Object.entries(e.pools)) {
        if (!k.startsWith('reg')) continue;
        const g = POOL_GROUP(E.pools[k]), m = Math.max(...v);
        if (g === 'melee') melee = m;
        if (!best || m > best.m) best = { g, m };
      }
      line = t.eBest(esc(name), pct(melee, 2), best && best.m > melee * 1.05 ? t.pg[best.g] : '', best ? pct(best.m, 2) : '');
    } else {
      line = (grp === 'curse' ? t.eCurse : grp === 'fixed' ? t.eFixedOnly : t.eDnOnly)(esc(name));
      if ((grp === 'dn' || grp === 'bless') && e.fixed.some(r => r[2] === 'n')) line += t.alsoFixed;
    }
  } else {
    let best = null;
    table.forEach(row => row.vals.forEach((v, i) => { if (!best || v > best.v) best = { g: row.g, i, v }; }));
    line = best && best.v > 0 ? t.eAnyBest(esc(names.join(t.sep)), t.pgAll[best.g], t.cols[best.i], pct(best.v, 1)) : '';
  }
  $('esum').innerHTML = `<div class="skillname">${keys.map((k, i) => `<span class="pick">${esc(names[i])}${badge(k)}</span>`).join('')}</div><p>${line}</p>`;

  // at least one selected effect, per weapon group and colour
  let maxAny = 0;
  table.forEach(r => r.vals.forEach(v => { maxAny = Math.max(maxAny, v); }));
  $('anyt').innerHTML = `<thead><tr><th>${t.type}</th>${t.cols.map(c => `<th class="num">${c}</th>`).join('')}</tr></thead><tbody>` +
    table.map(r => `<tr><td>${esc(t.pgAll[r.g])}</td>${r.vals.map(v => `<td class="num${v === maxAny && v > 0 ? ' hi' : ''}">${v > 0 ? pct(v, 2) : '—'}</td>`).join('')}</tr>`).join('') + '</tbody>';

  // per-roll table: chance one slot rolls any of the selected effects
  const sections = [['reg', t.sReg, t.tier], ['dn', t.sDn, t.tier], ['bless', t.sBless, null], ['curse', t.sCurse, t.lvl]];
  const poolKeys = new Set();
  keys.forEach(k => Object.keys(E.effects[k].pools).forEach(pk => poolKeys.add(pk)));
  let html = '';
  for (const [pre, title, heads] of sections) {
    const rows = [...poolKeys].filter(k => k.startsWith(pre)).sort().map(k => [k, [0, 1, 2].map(i => slotP(keys, k, i))]).filter(([, v]) => v.some(x => x > 0));
    if (!rows.length) continue;
    const cols = heads ? heads : [t.once];
    html += `<tr class="sect"><th>${title}</th>${cols.map(c => `<th class="num">${c}</th>`).join('')}</tr>`;
    const max = Math.max(...rows.map(([, v]) => Math.max(...v)));
    for (const [k, v] of rows) {
      const label = pre === 'bless' ? t.pg[k.slice(6)] || k.slice(6) : pre === 'curse' ? '—' : t.pg[POOL_GROUP(E.pools[k])];
      const vals = heads ? v : [v[0]];
      html += `<tr class="${Math.max(...v) === max && rows.length > 1 ? 'best' : ''}"><td>${esc(label)}</td>${vals.map(x => `<td class="num">${x > 0 ? pct(x, 2) : '—'}</td>`).join('')}</tr>`;
    }
  }
  $('pools').innerHTML = html ? `<tbody>${html}</tbody>` : `<tbody><tr><td class="empty">—</td></tr></tbody>`;

  // fixed-effect weapons for any of the selected effects
  const multi = keys.length > 1;
  const srcRank = r => r[4] === 'drop' ? (r[2] === 'n' ? 0 : 1) : r[4] === 'pick' ? 2 : (r[2] === 'n' ? 3 : 4);
  const fx = keys.flatMap(k => E.effects[k].fixed.map(r => [...r, k]))
    .sort((a, b) => srcRank(a) - srcRank(b) || b[1] - a[1] || (E.ewep[a[0]][1] - E.ewep[b[0]][1]) || nm(E.ewep[a[0]][0]).localeCompare(nm(E.ewep[b[0]][0])));
  $('e-fixed').textContent = fx.length ? t.nFixed(fx.length) : '';
  const LIMIT = 30, shown = est.all || fx.length <= LIMIT + 5 ? fx : fx.slice(0, LIMIT);
  const srcCell = ([, , mode, p, src]) => (src === 'pick' ? t.srcPick : src === 'drop' ? t.srcDrop + (mode === 'd' ? ` <span class="flag">${t.dnOnly}</span>` : '') : mode === 'd' ? t.srcShopDn : t.srcShop) + (p < 0.999 ? ` · ${t.chance(pct(p, 0))}` : '');
  const ncol = multi ? 5 : 4;
  $('fixed').innerHTML = fx.length ? `<thead><tr><th>${t.wep}</th><th>${t.type}</th><th>${t.rarity}</th>${multi ? `<th>${t.effCol}</th>` : ''}<th>${t.src}</th></tr></thead><tbody>` +
    shown.map(r => `<tr><td><span class="rar" style="background:var(--r${Math.min(3, r[1])})"></span>${esc(nm(E.ewep[r[0]][0]))}</td><td>${esc(nm(D.types[E.ewep[r[0]][1]]) || '')}</td><td>${t.rar[Math.min(3, r[1])]}</td>${multi ? `<td>${esc(nm(E.effects[r[5]].n))}</td>` : ''}<td>${srcCell(r)}</td></tr>`).join('') +
    (shown.length < fx.length ? `<tr><td colspan="${ncol}"><button type="button" class="chip" id="fx-all">${t.showAll(fx.length)}</button></td></tr>` : '') + '</tbody>'
    : `<tbody><tr><td class="empty">${t.noFixed}</td></tr></tbody>`;
  const more = $('fx-all');
  if (more) more.addEventListener('click', () => { est.all = true; renderEffect(); });
}

function renderEffStatic() {
  const t = T[lang];
  $('tab-skill').textContent = t.tabSkill; $('tab-effect').textContent = t.tabEffect;
  $('l-eff').textContent = t.eff; $('eq').placeholder = t.esearch;
  $('h-any').textContent = t.hAny; $('e-any').textContent = t.eAny; $('hint-any').textContent = t.hintAny;
  $('h-pool').textContent = t.hPool; $('e-pool').textContent = t.ePool; $('hint-pool').textContent = t.hintPool;
  $('h-fixed').textContent = t.hFixed; $('hint-fixed').textContent = t.hintFixed;
  $('en-title').textContent = t.enTitle;
  $('en-list').innerHTML = t.enNotes.map(n => `<li>${n}</li>`).join('');
  renderEffList();
  renderEffect();
}
function setView(v) {
  est.view = v;
  try { localStorage.setItem('nr-view', v); } catch (e) {}
  $('view-skill').hidden = v !== 'skill';
  $('view-effect').hidden = v !== 'effect';
  document.querySelectorAll('.tabs button').forEach(b => b.setAttribute('aria-selected', String(b.dataset.view === v)));
}
document.querySelectorAll('.tabs button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', renderEffStatic));
$('eq').addEventListener('input', renderEffList);
$('efflist').addEventListener('click', ev => {
  const b = ev.target.closest('[data-eff]');
  if (!b) return;
  const key = b.dataset.eff;
  est.sel.has(key) ? est.sel.delete(key) : est.sel.add(key);
  est.all = false;
  b.setAttribute('aria-pressed', String(est.sel.has(key)));
  renderEffect();
});

renderStatic();
renderResults();
renderEffStatic();
setView(est.view);
})();
</script>
