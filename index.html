<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Noto+Sans+JP:wght@400;500;700&family=Noto+Sans+TC:wght@400;500;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: a control strip over a two-pane board, ranked locations on the left, the chosen location's weapon breakdown on the right; stacks to one column on phones. */
:root {
  --bg: #eef0f4;
  --panel: #ffffff;
  --ink: #1b2030;
  --muted: #5b6275;
  --line: #d6dae3;
  --accent: #9a6a1c;
  --accent-soft: #f3e7cf;
  --bar: #c99a45;
  --bar-track: #e6e9ef;
  --focus: #3b5bdb;
  --a-std: #6f7686; --a-fire: #d0541f; --a-lightning: #c99a00; --a-holy: #b08a3e;
  --a-magic: #3f63d6; --a-frost: #2a93b4; --a-poison: #4e8a2e; --a-blood: #b3243a;
  --a-madness: #d88a12; --a-rot: #9b4a2a; --a-sleep: #7a5bc4;
  --r0: #7b8090; --r1: #3a77c9; --r2: #8a4fc4; --r3: #c49a2a;
  --display: "Marcellus SC", "Noto Serif TC", Georgia, serif;
  --body: "Noto Sans TC", "Noto Sans JP", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, "Cascadia Mono", Consolas, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1220; --panel: #171b2c; --ink: #e6e3d8; --muted: #9aa0b4; --line: #2a3047;
    --accent: #e0b867; --accent-soft: #33291a; --bar: #d4a64f; --bar-track: #242a40; --focus: #8fa8ff;
    --a-std: #9aa1b3; --a-fire: #f07a45; --a-lightning: #f0cc3a; --a-holy: #e3c47e;
    --a-magic: #7f9cff; --a-frost: #5cc6e4; --a-poison: #84c35c; --a-blood: #ef5a70;
    --a-madness: #f5a623; --a-rot: #d07a54; --a-sleep: #ad8ff0;
    --r0: #a2a7b6; --r1: #6aa6f2; --r2: #b989f0; --r3: #e6c25a;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1220; --panel: #171b2c; --ink: #e6e3d8; --muted: #9aa0b4; --line: #2a3047;
  --accent: #e0b867; --accent-soft: #33291a; --bar: #d4a64f; --bar-track: #242a40; --focus: #8fa8ff;
  --a-std: #9aa1b3; --a-fire: #f07a45; --a-lightning: #f0cc3a; --a-holy: #e3c47e;
  --a-magic: #7f9cff; --a-frost: #5cc6e4; --a-poison: #84c35c; --a-blood: #ef5a70;
  --a-madness: #f5a623; --a-rot: #d07a54; --a-sleep: #ad8ff0;
  --r0: #a2a7b6; --r1: #6aa6f2; --r2: #b989f0; --r3: #e6c25a;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.55; }
html[lang="ja"] body { font-family: "Noto Sans JP", "Noto Sans TC", system-ui, sans-serif; }
.wrap { max-width: 1240px; margin: 0 auto; padding-inline: 16px; padding-block: 20px 48px; display: grid; gap: 18px; }
header { display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
h1 { font-family: var(--display); font-weight: 400; font-size: clamp(1.6rem, 3.6vw, 2.3rem); letter-spacing: .04em; margin: 0; line-height: 1.1; text-wrap: balance; }
h1 small { display: block; font-family: var(--body); font-size: .9rem; letter-spacing: .02em; color: var(--muted); margin-top: 6px; font-weight: 500; }
h2 { font-size: 1rem; margin: 0; font-weight: 700; letter-spacing: .02em; }
.eyebrow { font-size: .72rem; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); font-weight: 500; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; background: var(--panel); }
.seg button { border: 0; background: transparent; color: var(--muted); font: inherit; font-size: .85rem; padding: 5px 14px; border-radius: 999px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--panel); font-weight: 700; }
button:focus-visible, input:focus-visible, select:focus-visible, [tabindex]:focus-visible { outline: 2px solid var(--focus); outline-offset: 2px; }

.controls { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; grid-template-columns: minmax(0, 1.4fr) minmax(0, 1fr); gap: 14px 18px; }
.field { display: grid; gap: 6px; min-width: 0; }
.field label, .field .lbl { font-size: .78rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; }
input[type="search"], select { font: inherit; color: var(--ink); background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; width: 100%; min-width: 0; }
.filters { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; align-content: start; }
.checks { display: flex; flex-wrap: wrap; gap: 6px 14px; font-size: .88rem; }
.checks label { display: inline-flex; align-items: center; gap: 6px; cursor: pointer; color: var(--ink); font-size: .88rem; letter-spacing: 0; }
.skilllist { max-height: 228px; overflow-y: auto; border: 1px solid var(--line); border-radius: 8px; background: var(--bg); padding: 6px; display: grid; gap: 8px; }
.sgroup { display: grid; gap: 4px; }
.sgroup .eyebrow { padding: 2px 4px; display: flex; align-items: center; gap: 6px; }
.chips { display: flex; flex-wrap: wrap; gap: 4px; }
.chip { border: 1px solid var(--line); background: var(--panel); color: var(--ink); font: inherit; font-size: .84rem; padding: 3px 9px; border-radius: 6px; cursor: pointer; }
.chip:hover { border-color: var(--accent); }
.chip[aria-pressed="true"] { background: var(--accent-soft); border-color: var(--accent); font-weight: 700; }
.dot { width: 9px; height: 9px; border-radius: 50%; display: inline-block; flex: none; background: var(--a-std); }

.summary { border-left: 4px solid var(--accent); background: var(--panel); border-radius: 0 10px 10px 0; padding: 14px 16px; display: grid; gap: 6px; }
.summary .skillname { font-size: 1.35rem; font-weight: 700; display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
.summary p { margin: 0; max-width: 75ch; }
.pick { display: inline-flex; align-items: center; gap: 6px; font-size: 1.05rem; }
.aff { font-size: .75rem; font-weight: 700; padding: 2px 8px; border-radius: 999px; border: 1px solid currentColor; }
.big { font-family: var(--mono); font-weight: 500; }

.board { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.1fr); gap: 18px; align-items: start; }
.pane { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 14px; display: grid; gap: 10px; min-width: 0; }
.pane-head { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; flex-wrap: wrap; }
.hint { font-size: .8rem; color: var(--muted); margin: 0; }
ol.locs { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; }
.loc { display: grid; grid-template-columns: 1.6em minmax(0, 1fr) 4.2em; gap: 4px 10px; align-items: center; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid transparent; }
.loc:hover { background: var(--bg); }
.loc[aria-selected="true"] { border-color: var(--accent); background: var(--accent-soft); }
.loc .rank { font-family: var(--mono); color: var(--muted); font-size: .8rem; text-align: right; }
.loc .name { display: flex; align-items: center; gap: 7px; flex-wrap: wrap; min-width: 0; }
.loc .name span.t { overflow-wrap: anywhere; }
.tag { font-size: .68rem; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; white-space: nowrap; }
.loc .pct { font-family: var(--mono); text-align: right; font-weight: 500; font-variant-numeric: tabular-nums; }
.loc .barline { grid-column: 2 / 4; height: 5px; background: var(--bar-track); border-radius: 3px; overflow: hidden; }
.loc .barline i { display: block; height: 100%; background: var(--bar); border-radius: 3px; }
.loc .sub { grid-column: 2 / 4; font-size: .76rem; color: var(--muted); font-variant-numeric: tabular-nums; }

.tablewrap { overflow-x: auto; }
table { border-collapse: collapse; width: 100%; font-size: .88rem; }
th, td { text-align: left; padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
th { font-size: .74rem; color: var(--muted); font-weight: 500; letter-spacing: .04em; white-space: nowrap; }
td.num, th.num { text-align: right; font-family: var(--mono); font-variant-numeric: tabular-nums; white-space: nowrap; }
tr.best td { background: var(--accent-soft); }
.minibar { display: inline-block; vertical-align: middle; width: 56px; height: 5px; background: var(--bar-track); border-radius: 3px; overflow: hidden; margin-left: 6px; }
.minibar i { display: block; height: 100%; background: var(--bar); }
.rar { display: inline-block; width: 8px; height: 8px; border-radius: 2px; margin-right: 6px; vertical-align: middle; }
.empty { color: var(--muted); padding: 18px 4px; }
details.notes { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 12px 16px; }
details.notes summary { cursor: pointer; font-weight: 700; }
details.notes ul { margin: 10px 0 0; padding-left: 1.2em; display: grid; gap: 6px; max-width: 80ch; font-size: .9rem; color: var(--muted); }
.busy { opacity: .55; transition: opacity .15s; }
@media (max-width: 860px) {
  .controls, .board { grid-template-columns: minmax(0, 1fr); }
}
@media (max-width: 420px) { .filters { grid-template-columns: minmax(0, 1fr); } }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

</head>

<div class="wrap">
  <header>
    <h1 id="title">Nightreign Skill Finder<small id="subtitle"></small></h1>
    <div class="seg" role="group" aria-label="Language">
      <button type="button" data-lang="zh" aria-pressed="true">中文</button>
      <button type="button" data-lang="ja" aria-pressed="false">日本語</button>
      <button type="button" data-lang="en" aria-pressed="false">EN</button>
    </div>
  </header>

  <section class="controls" aria-label="Filters">
    <div class="field">
      <label for="q" id="l-skill"></label>
      <input type="search" id="q" autocomplete="off">
      <div class="skilllist" id="skilllist" role="listbox" aria-labelledby="l-skill"></div>
    </div>
    <div class="filters">
      <div class="field">
        <label for="cls" id="l-cls"></label>
        <select id="cls"></select>
      </div>
      <div class="field">
        <label for="map" id="l-map"></label>
        <select id="map"></select>
      </div>
      <div class="field" style="grid-column: 1 / -1">
        <span class="lbl" id="l-var"></span>
        <div class="checks">
          <label><input type="checkbox" id="v-base" checked> <span id="t-v-base"></span></label>
          <label><input type="checkbox" id="v-v"> <span id="t-v-v"></span></label>
          <label><input type="checkbox" id="v-c"> <span id="t-v-c"></span></label>
          <label><input type="checkbox" id="v-x"> <span id="t-v-x"></span></label>
        </div>
      </div>
      <div class="field" style="grid-column: 1 / -1">
        <span class="lbl" id="l-kind"></span>
        <div class="checks">
          <label><input type="checkbox" id="k-site" checked> <span id="t-k-site"></span></label>
          <label><input type="checkbox" id="k-other" checked> <span id="t-k-other"></span></label>
        </div>
      </div>
    </div>
  </section>

  <section class="summary" id="summary" aria-live="polite"></section>

  <section class="board">
    <div class="pane">
      <div class="pane-head"><h2 id="h-locs"></h2><span class="eyebrow" id="e-locs"></span></div>
      <p class="hint" id="hint-locs"></p>
      <ol class="locs" id="locs"></ol>
    </div>
    <div class="pane" id="detail">
      <div class="pane-head"><h2 id="h-detail"></h2><span class="eyebrow" id="e-detail"></span></div>
      <p class="hint" id="hint-types"></p>
      <div class="tablewrap"><table id="types"></table></div>
      <h2 id="h-weps" style="margin-top:8px"></h2>
      <p class="hint" id="hint-weps"></p>
      <div class="tablewrap"><table id="weps"></table></div>
    </div>
  </section>

  <details class="notes">
    <summary id="n-title"></summary>
    <ul id="n-list"></ul>
  </details>
</div>

    groups.get(key).push([s.key, n]);
  }
  const order = [...AFF_ORDER, 'unique'];
  let html = '';
  for (const key of order) {
    const list = groups.get(key);
    if (!list) continue;
    list.sort((a, b) => a[1].localeCompare(b[1], lang === 'en' ? 'en' : lang === 'ja' ? 'ja' : 'zh-Hant'));
    const label = key === 'unique' ? t.unique : t.affName[key];
    const col = key === 'unique' ? 'var(--accent)' : affColor(key);
    html += `<div class="sgroup"><div class="eyebrow"><span class="dot" style="background:${col}"></span>${label}</div><div class="chips">` +
      list.map(([id, n]) => `<button type="button" class="chip" data-skill="${esc(id)}" aria-pressed="${st.skills.has(id)}">${esc(n)}</button>`).join('') + '</div></div>';
  }
  $('skilllist').innerHTML = html || `<div class="empty">—</div>`;
}
function esc(s) { return String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c])); }

function locLabel(g) { return nm(g.label); }

function bestType(r) {
  let best = null;
  for (const [ty, ps] of r.gSkill) {
    const all = r.gAll.get(ty) || 0;
    if (!all) continue;
    const cond = ps / all;
    if (ps / r.rows.reduce((a, b) => a + b, 0) < 0.03) continue;
    if (!best || cond > best.cond) best = { ty, cond };
  }
  return best;
}

let lastRes = [];
function renderResults() {
  const t = T[lang];
  const clear = () => { $('locs').innerHTML = ''; $('types').innerHTML = ''; $('weps').innerHTML = ''; $('h-detail').textContent = t.detail; $('e-detail').textContent = ''; };
  if (!st.skills.size) { lastRes = []; $('summary').innerHTML = `<p>${t.pick}</p>`; clear(); return; }
  const res = analyse(st.skills);
  lastRes = res;
  const keys = [...st.skills];
  const sName = keys.map(skillLabel).join(t.sep);
  const affHtml = keys.map(k => {
    const s = SK.get(k), a = s && !s.u ? s.a : null;
    const badge = a ? `<span class="aff" style="color:${affColor(a)}">${t.affName[a]}</span>` : `<span class="aff" style="color:var(--accent)">${t.unique}</span>`;
    return keys.length > 1 ? `<span class="pick">${esc(skillLabel(k))} ${badge}</span>` : `${esc(skillLabel(k))} ${badge}`;
  }).join('');
  if (!res.length) {
    $('summary').innerHTML = `<div class="skillname">${affHtml}</div><p>${t.none}</p>`;
    $('locs').innerHTML = '';
    $('types').innerHTML = ''; $('weps').innerHTML = '';
    $('h-detail').textContent = t.detail; $('e-detail').textContent = '';
    return;
  }
  if (!st.sel || !res.some(r => r.g === st.sel)) st.sel = res[0].g;
  const top = res[0], bt = bestType(top);
  $('summary').innerHTML = `<div class="skillname">${affHtml}</div><p>${t.best(esc(sName), esc(locLabel(top.g)) + (top.g.var ? ` <span class="tag">${varTag(top.g.var)}</span>` : ''), pct(top.any, 1), bt ? esc(nm(D.types[bt.ty])) : '', bt ? pct(bt.cond, 1) : '')}</p>`;
  const max = top.any;
  $('locs').innerHTML = res.slice(0, 30).map((r, i) => {
    const g = r.g;
    const tags = [g.map === 'hollow' ? t.hollow : '', varTag(g.var)].filter(Boolean).map(x => `<span class="tag">${x}</span>`).join('');
    return `<li class="loc" role="option" tabindex="0" data-i="${i}" aria-selected="${g === st.sel}">
      <span class="rank">${i + 1}</span>
      <span class="name"><span class="dot" style="background:${g.aff ? affColor(g.aff === 'madness' || g.aff === 'rot' || g.aff === 'sleep' ? g.aff : g.aff) : 'var(--line)'}"></span><span class="t">${esc(locLabel(g))}</span>${tags}</span>
      <span class="pct">${pct(r.any, 1)}</span>
      <span class="barline"><i style="width:${(r.any / max * 100).toFixed(1)}%"></i></span>
      <span class="sub">${t.sub1}: ${r.rows.filter(p => p > 0).map(p => pct(p)).join(' · ')}</span>
    </li>`;
  }).join('');
  renderDetail();
}

function renderDetail() {
  const t = T[lang];
  const r = lastRes.find(x => x.g === st.sel);
  if (!r) return;
  $('h-detail').textContent = `${t.detail}：${locLabel(r.g)}`;
  $('e-detail').textContent = varTag(r.g.var);
  const totalSkill = [...r.typeSkill.values()].reduce((a, b) => a + b, 0);
  const cond = (m, a, ty) => (a.get(ty) ? (m.get(ty) || 0) / a.get(ty) : null);
  const types = [...r.typeSkill.entries()].map(([ty, ps]) => ({ ty, ps, g: cond(r.gSkill, r.gAll, ty), k: cond(r.kSkill, r.kAll, ty), share: ps / totalSkill }))
    .sort((a, b) => (b.g ?? -1) - (a.g ?? -1) || (b.k ?? -1) - (a.k ?? -1));
  const cell = v => v == null ? '<td class="num">—</td>' : `<td class="num">${pct(v, 1)}<span class="minibar"><i style="width:${Math.min(100, v * 100).toFixed(1)}%"></i></span></td>`;
  const bt = bestType(r);
  $('types').innerHTML = `<thead><tr><th>${t.type}</th><th class="num">${t.slotG}</th><th class="num">${t.slotK}</th><th class="num">${t.share}</th></tr></thead><tbody>` +
    types.map(x => `<tr class="${bt && bt.ty === x.ty ? 'best' : ''}"><td>${esc(nm(D.types[x.ty]))}</td>${cell(x.g)}${cell(x.k)}<td class="num">${pct(x.share, 1)}</td></tr>`).join('') + '</tbody>';
  // individual weapons whose conditional odds differ from their type average
  const rows = [...r.wepSkill.entries()].map(([w, ps]) => {
    const all = r.wepAll.get(w) || 1, ty = D.weps[w][0];
    const typeCond = (r.gSkill.get(ty) || 0) / (r.gAll.get(ty) || 1);
    return { w, ps, cond: ps / all, ty, typeCond, rar: D.weps[w][2] };
  }).filter(x => x.ps / totalSkill > 0.002);
  rows.sort((a, b) => Math.abs(b.cond - b.typeCond) - Math.abs(a.cond - a.typeCond) || b.cond - a.cond);
  const shown = rows.slice(0, 12).sort((a, b) => b.cond - a.cond);
  $('weps').innerHTML = shown.length ? `<thead><tr><th>${t.wep}</th><th>${t.type}</th><th class="num">${t.cond}</th><th class="num">${t.typeAvg}</th></tr></thead><tbody>` +
    shown.map(x => `<tr><td><span class="rar" style="background:var(--r${Math.min(3, x.rar)})" title="${t.rar[Math.min(3, x.rar)]}"></span>${esc(nm(D.wnames[x.w]))}</td><td>${esc(nm(D.types[x.ty]))}</td><td class="num">${pct(x.cond, 1)}</td><td class="num">${pct(x.typeCond, 1)}</td></tr>`).join('') + '</tbody>' : '';
}

function refresh() {
  document.querySelector('.board').classList.add('busy');
  setTimeout(() => { renderResults(); document.querySelector('.board').classList.remove('busy'); }, 16);
}

// ---------- events ----------
document.querySelectorAll('.seg button').forEach(b => b.addEventListener('click', () => {
  lang = b.dataset.lang;
  try { localStorage.setItem('nr-lang', lang); } catch (e) {}
  renderStatic(); renderResults();
}));
$('q').addEventListener('input', renderSkills);
$('skilllist').addEventListener('click', e => {
  const b = e.target.closest('[data-skill]');
  if (!b) return;
  const key = b.dataset.skill;
  st.skills.has(key) ? st.skills.delete(key) : st.skills.add(key);
  st.sel = null;
  b.setAttribute('aria-pressed', String(st.skills.has(key)));
  refresh();
});
$('cls').addEventListener('change', e => { st.cls = e.target.value; refresh(); });
$('map').addEventListener('change', e => { st.map = e.target.value; refresh(); });
[['v-base', ''], ['v-v', 'v'], ['v-c', 'c'], ['v-x', 'x']].forEach(([id, v]) => $(id).addEventListener('change', e => { e.target.checked ? st.vars.add(v) : st.vars.delete(v); refresh(); }));
$('k-site').addEventListener('change', e => { st.site = e.target.checked; refresh(); });
$('k-other').addEventListener('change', e => { st.other = e.target.checked; refresh(); });
function pick(li) { const r = lastRes[+li.dataset.i]; if (!r) return; st.sel = r.g; document.querySelectorAll('.loc').forEach(x => x.setAttribute('aria-selected', String(x === li))); renderDetail(); }
$('locs').addEventListener('click', e => { const li = e.target.closest('.loc'); if (li) pick(li); });
$('locs').addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { const li = e.target.closest('.loc'); if (li) { e.preventDefault(); pick(li); } } });

renderStatic();
renderResults();
})();
</script>

</body>
</html>
